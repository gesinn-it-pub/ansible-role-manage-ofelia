---
- name: Ensure Ofelia | Ensure installation directory
  ansible.builtin.file:
    path: "{{ manage_ofelia_installation_path }}"
    state: directory
    mode: "0755"

- name: Ensure Ofelia | Ensure reports directory
  ansible.builtin.file:
    path: "{{ manage_ofelia_installation_path }}/reports"
    state: directory
    mode: "0755"
  when: manage_ofelia_reports_enabled | bool

- name: Ensure Ofelia | Ensure docker-compose.yml
  ansible.builtin.template:
    dest: "{{ manage_ofelia_installation_path }}/docker-compose.yml"
    src: docker-compose.yml.j2
    mode: "0644"

- name: Ensure Ofelia | Remove the config.ini of 1.0.x
  # Ofelia 0.3.x ignores it in Docker mode, the labels of docker-compose.yml replace it
  ansible.builtin.file:
    path: "{{ manage_ofelia_installation_path }}/config.ini"
    state: absent

- name: Ensure Ofelia | Ensure the service is running
  community.docker.docker_compose_v2:
    project_src: "{{ manage_ofelia_installation_path }}"
    project_name: ofelia
    state: present
  when: manage_ofelia_manage_service | bool
