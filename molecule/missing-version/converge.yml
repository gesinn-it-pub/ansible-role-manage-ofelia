---
- name: Converge
  hosts: all
  tasks:
    - name: Apply the role without manage_ofelia_version
      block:
        - name: Apply role
          ansible.builtin.include_role:
            name: ansible-role-manage-ofelia
          vars:
            manage_ofelia_installation_path: /tmp/molecule-ofelia-test
        - name: Record that the role did not fail
          ansible.builtin.copy:
            dest: /tmp/molecule-ofelia-result
            content: "passed\n"
            mode: "0644"
      rescue:
        - name: Record that the role failed
          ansible.builtin.copy:
            dest: /tmp/molecule-ofelia-result
            content: "failed\n"
            mode: "0644"
