---
- name: Verify with-reports
  hosts: all
  vars:
    install_path: /tmp/molecule-ofelia-test
  tasks:
    - name: Read docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ install_path }}/docker-compose.yml"
      register: compose_raw

    - name: Stat the files and the reports directory
      ansible.builtin.stat:
        path: "{{ install_path }}/{{ item }}"
      loop: [reports, config.ini]
      register: paths

    - name: Parse the compose file
      ansible.builtin.set_fact:
        service: "{{ (compose_raw.content | b64decode | from_yaml).services.ofelia }}"
        compose: "{{ compose_raw.content | b64decode | from_yaml }}"

    - name: Assert the image and container name
      ansible.builtin.assert:
        that:
          - service.image == 'mcuadros/ofelia:0.3.22'
          - service.container_name == 'ofelia'

    - name: Assert the Docker socket is mounted read-only
      ansible.builtin.assert:
        that: "'/var/run/docker.sock:/var/run/docker.sock:ro' in service.volumes"

    - name: Assert the daemon reads its configuration from Docker labels only
      # Ofelia 0.3.x ignores a configuration file in Docker mode
      ansible.builtin.assert:
        that:
          - service.command == 'daemon --docker'
          - not paths.results[1].stat.exists

    - name: Assert Traefik does not expose the container
      ansible.builtin.assert:
        that: "'traefik.enable=false' in service.labels"

    - name: Assert the compose file does not join an external network
      ansible.builtin.assert:
        that:
          - compose.networks is not defined
          - service.networks is not defined

    - name: Assert the keepalive job is registered
      ansible.builtin.assert:
        that:
          - "'ofelia.job-local.keepalive.schedule=@daily' in service.labels"
          - "'ofelia.job-local.keepalive.command=true' in service.labels"

    - name: Assert reports are saved to the mounted directory
      ansible.builtin.assert:
        that:
          - "'ofelia.save-folder=/reports' in service.labels"
          - "'./reports:/reports' in service.volumes"
          - paths.results[0].stat.isdir
